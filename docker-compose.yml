services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: team_dev
      POSTGRES_PASSWORD: ${TEAM_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: team_workspace
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres_hr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U team_dev -d team_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_hr_data:
